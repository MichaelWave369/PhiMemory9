name: PhiMemory9 tests
on:
  push:
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install core
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Frozen Living Memory canonical vectors
        run: node scripts/living_conformance.mjs
      - name: Run demo
        run: phi-memory9 demo
      - name: Synthetic evidence and contradiction demo
        run: phi-memory9 evidence-demo
      - name: Reproducible retrieval baseline
        run: phi-memory9 benchmark
      - name: Frozen synthetic R0.5 retrieval report
        run: phi-memory9 benchmark-r05 > "$RUNNER_TEMP/benchmark-r05.json"
      - name: Seed and audit a new synthetic local database
        run: |
          phi-memory9 seed-lab --db "$RUNNER_TEMP/phi-r03-fixture.sqlite3"
          phi-memory9 verify-evidence --db "$RUNNER_TEMP/phi-r03-fixture.sqlite3"
      - name: Governance CLI approval and privacy smoke test
        run: |
          python -c "import json,sys;from phimemory9.governance import SCHEMA;from phimemory9 import MemoryEngine;db=MemoryEngine(sys.argv[1]);mid=db.db.execute('SELECT id FROM memories ORDER BY created_at LIMIT 1').fetchone()[0];open(sys.argv[2],'w').write(json.dumps({'schema':SCHEMA,'action':'loop','reason':'CI synthetic test','memory_id':mid,'route':'hold'}));db.close()" "$RUNNER_TEMP/phi-r03-fixture.sqlite3" "$RUNNER_TEMP/plan.json"
          phi-memory9 plan-review --db "$RUNNER_TEMP/phi-r03-fixture.sqlite3" --plan "$RUNNER_TEMP/plan.json"
          python -c "import json,sys;from phimemory9.governance import load_plan,fingerprint;print(fingerprint(load_plan(sys.argv[1])))" "$RUNNER_TEMP/plan.json" > "$RUNNER_TEMP/digest.txt"
          phi-memory9 apply-plan --db "$RUNNER_TEMP/phi-r03-fixture.sqlite3" --plan "$RUNNER_TEMP/plan.json" --approve-sha256 "$(cat "$RUNNER_TEMP/digest.txt")"
          phi-memory9 verify --db "$RUNNER_TEMP/phi-r03-fixture.sqlite3"

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install visual lab
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Build React lab
        working-directory: web
        run: npm run build

  living-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: MichaelWave369/Memoria
          ref: 94083ad7c710097658ba96b7a1376e5e044d2382
          path: native/Memoria
      - uses: actions/checkout@v4
        with:
          repository: MichaelWave369/PhiGenesis
          ref: bfedf68cbc7649adb13da97a78a61e68bbf3d970
          path: native/PhiGenesis
      - uses: actions/checkout@v4
        with:
          repository: MichaelWave369/XiPhiOmega
          ref: 18c000897beedfb5a9759befcfd4e2330f61e227
          path: native/XiPhiOmega
      - uses: actions/checkout@v4
        with:
          repository: MichaelWave369/PhiOS
          ref: 0eb88a0ab58d51b54962457cdb510f603827bc88
          path: native/PhiOS
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python -m pip install -e . 'cryptography>=43'
      - name: Native disposable-source proof loop
        run: >-
          python -m phimemory9.living_demo --output "$RUNNER_TEMP/living-native"
          --memoria-source native/Memoria --xi-source native/XiPhiOmega
          --genesis-source native/PhiGenesis --phios-source native/PhiOS --require-native
      - name: Retain synthetic evidence
        uses: actions/upload-artifact@v4
        with:
          name: living-memory-fixture-evidence
          path: |
            ${{ runner.temp }}/living-native/*.json
            ${{ runner.temp }}/living-native/benchmark/report.json
